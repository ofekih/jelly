      stroke="#ffffff"
      stroke-width="2.4"
      stroke-linecap="round"
      opacity="0.65"
    />
  </g>
  <!-- Right Berry-Coral Jelly Bean (upright, no tilt) -->
  <g filter="url(#glow)">
    <path
      d="M32 22 C40 19, 48 23, 48 32 C48 37, 45 40, 46 45 C47 51, 41 55, 34 53 C26 51, 27 41, 30 35 C32 30, 26 24, 32 22 Z"
      fill="url(#berryBean)"
    />
    <path
      d="M34 25 C38 24, 42 26, 42 31 C42 34, 39 38, 37 41"
