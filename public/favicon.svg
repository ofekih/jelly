  </defs>
  <rect width="64" height="64" rx="16" fill="#09090b" />
  <!-- Left Emerald Jelly Bean (upright, no tilt) -->
  <g filter="url(#glow)">
    <path
      d="M17 17 C25 14, 33 18, 33 27 C33 32, 30 35, 31 40 C32 46, 26 50, 19 48 C11 46, 12 36, 15 30 C17 25, 11 19, 17 17 Z"
